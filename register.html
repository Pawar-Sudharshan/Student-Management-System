<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">

        <div class="container-fluid px-3">

            <div class="d-flex align-items-center">

                <a class="navbar-brand me-3" href="#">
                    <img src="./asserts/logo.png" width="80" height="80" alt="CVR Logo">
                </a>

                <div>
                    <h3 class="college-title mb-0">
                        CVR COLLEGE OF ENGINEERING
                    </h3>

                    <div class="d-flex flex-column align-items-end">
                        <small class="college-tagline">
                            in Pursuit of Excellence
                        </small>

                        <small class="college-subtitle">
                            (An Autonomous Institution | NAAC 'A' Grade)
                        </small>
                    </div>
                </div>

            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="courses.html">Courses</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                    <a class="nav-link " href="login.html">Login</a>
                </div>

            </div>

        </div>

    </nav>


    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center">
                        <h1 class="mb-0">Create Your Account</h1>
                    </div>
                    <div class="card-body p-4">
                        <form id="registerForm" action="login.html" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        <div class="text-center mt-4">
                            <p class="mb-2">Already have an account?</p>
                            <a href="login.html#login" class="text-decoration-none fw-semibold">Login here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container-fluid mt-auto bg-light">
        <div class="container">
            <div class="row align-items-center py-3 border-top">
                <div class="col-12 col-md-6 d-flex align-items-center justify-content-center justify-content-md-start mb-3 mb-md-0">
                    <a href="/" class="me-2 text-decoration-none d-flex align-items-center">
                        <img src="./asserts/logo.png" width="40" alt="Logo">
                    </a>
                    <span class="text-body-secondary mb-0">
                        © 2025 CVR College
                    </span>
                </div>
                <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                    <ul class="nav list-unstyled d-flex mb-0">
                        <li class="ms-3">
                            <a class="text-body-secondary" href="#">
                                <i class="bi bi-instagram fs-5"></i>
                            </a>
                        </li>
                        <li class="ms-3">
                            <a class="text-body-secondary" href="#">
                                <i class="bi bi-linkedin fs-5"></i>
                            </a>
                        </li>
                        <li class="ms-3">
                            <a class="text-body-secondary" href="#">
                                <i class="bi bi-facebook fs-5"></i>
                            </a>
                        </li>
                        <li class="ms-3">
                            <a class="text-body-secondary" href="#">
                                <i class="bi bi-threads-fill fs-5"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>

</body>

</html>
