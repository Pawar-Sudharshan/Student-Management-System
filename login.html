<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">

        <div class="container-fluid px-3">

            <div class="d-flex align-items-center">

                <a class="navbar-brand me-3" href="#">
                    <img src="./asserts/logo.png" width="80" height="80" alt="CVR Logo">
                </a>

                <div>
                    <h3 class="college-title mb-0">
                        CVR COLLEGE OF ENGINEERING
                    </h3>

                    <div class="d-flex flex-column align-items-end">
                        <small class="college-tagline">
                            in Pursuit of Excellence
                        </small>

                        <small class="college-subtitle">
                            (An Autonomous Institution | NAAC 'A' Grade)
                        </small>
                    </div>
                </div>

            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About</a>
                    <a class="nav-link" href="courses.html">Courses</a>
                    <a class="nav-link" href="contact.html">Contact</a>
                    <a class="nav-link active" href="login.html">Login</a>
                </div>

            </div>

        </div>

    </nav>

    <!-- Main Content -->
    <main class="container my-5 flex-grow-1">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="card shadow-lg border-0">

                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Student Login</h2>
                    </div>

                    <div class="card-body p-4">

                        <form action="dashboard.html" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-2">Don't have an account?</p>
                            <a href="register.html" class="text-decoration-none fw-semibold">Register here</a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="container-fluid mt-auto">

        <div class="d-flex flex-wrap justify-content-between align-items-center py-3 border-top px-3">

            <div class="col-md-4 d-flex align-items-center">

                <a href="/" class="me-2 text-decoration-none">
                    <img src="./asserts/logo.png" width="40" alt="Logo">
                </a>

                <span class="text-body-secondary">
                    © 2025 CVR College
                </span>

            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">

                <li class="ms-3">
                    <a class="text-body-secondary" href="#">
                        <i class="bi bi-instagram fs-5"></i>
                    </a>
                </li>

                <li class="ms-3">
                    <a class="text-body-secondary" href="#">
                        <i class="bi bi-linkedin fs-5"></i>
                    </a>
                </li>

                <li class="ms-3">
                    <a class="text-body-secondary" href="#">
                        <i class="bi bi-facebook fs-5"></i>
                    </a>
                </li>

                <li class="ms-3">
                    <a class="text-body-secondary" href="#">
                        <i class="bi bi-threads-fill fs-5"></i>
                    </a>
                </li>

            </ul>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
